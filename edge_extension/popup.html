<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kết nối Mandarin Studio</title>
<style>body{font:14px system-ui;background:#10233a;color:#eef4fc;width:320px;padding:16px}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0}button{background:#67e8d1;border:0;cursor:pointer}p{line-height:1.5}small{color:#bbcddd}</style>
<h3>ChatGPT → Mandarin Studio</h3><p>Chọn tab ChatGPT đang đăng nhập trên Edge. Dán mã từ nút <b>Kết nối Edge hiện tại…</b> trong tool.</p>
<input id="code" type="password" placeholder="Mã kết nối cục bộ" autocomplete="off">
<button id="connect">Kết nối tab này</button><button id="disconnect">Ngắt kết nối</button>
<p id="status"></p><small>Chỉ tab này nhận yêu cầu khi tool chạy. Không đọc lịch sử chat, cookie hoặc mật khẩu. Giữ tab mở khi viết bài/tạo ảnh.</small>
<script src="popup.js"></script></html>
